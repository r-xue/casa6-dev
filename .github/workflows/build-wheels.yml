name: Build CASA6 Wheels (Multi-Arch)

on:
  push:
    branches:
      - main
      - 'fix/*'
      - 'feat/*'
      - 'feature/*'
      - 'release/*'
      - 'ci/*'
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches:
      - main
      - 'ci/*'
      - 'feat/*'
      - 'feature/*'
  workflow_dispatch:
    inputs:
      casa_branch:
        description: 'CASA6 branch or tag to build (leave empty for upstream default)'
        required: false
        default: ''
        type: string
      python_version:
        description: 'Python version to build (all, 3.12, 3.13, 3.14)'
        required: false
        default: 'all'
        type: choice
        options:
          - 'all'
          - '3.12'
          - '3.13'
          - '3.14'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-wheels:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental || false }}
    if: >-
      (github.event_name != 'pull_request' || matrix.pr_enabled == true) &&
      (
        github.event_name != 'workflow_dispatch' ||
        inputs.python_version == '' ||
        inputs.python_version == 'all' ||
        inputs.python_version == matrix.pyver
      )
    strategy:
      fail-fast: false
      matrix:
        include:
          # ============================================================
          # Linux x86_64
          # ============================================================
          - name: Linux x86_64 (Python 3.12)
            os: ubuntu-24.04
            environment: build-linux-312
            arch: linux-64-cp312
            pyver: '3.12'
            pr_enabled: true

          - name: Linux x86_64 (Python 3.13)
            os: ubuntu-24.04
            environment: build-linux-313
            arch: linux-64-cp313
            pyver: '3.13'
            pr_enabled: false

          - name: Linux x86_64 (Python 3.14)
            os: ubuntu-24.04
            environment: build-linux-314
            arch: linux-64-cp314
            pyver: '3.14'
            pr_enabled: false
            experimental: true

          # ============================================================
          # Linux x86_64 with GPU (CUDA) support
          # ============================================================
          - name: Linux x86_64 GPU (Python 3.12)
            os: ubuntu-24.04
            environment: build-linux-gpu
            arch: linux-64-cuda-cp312
            pyver: '3.12'
            pixi_flags: "--platform linux-64-cuda"
            pr_enabled: true

          # ============================================================
          # macOS Apple Silicon (ARM64)
          # ============================================================
          - name: macOS ARM64 (Python 3.12)
            os: macos-14
            environment: build-arm-312
            arch: osx-arm64-cp312
            pyver: '3.12'
            pr_enabled: true

          - name: macOS ARM64 (Python 3.13)
            os: macos-14
            environment: build-arm-313
            arch: osx-arm64-cp313
            pyver: '3.13'
            pr_enabled: false

          - name: macOS ARM64 (Python 3.14)
            os: macos-14
            environment: build-arm-314
            arch: osx-arm64-cp314
            pyver: '3.14'
            pr_enabled: false
            experimental: true

          # ============================================================
          # Linux ARM64
          # ============================================================
          - name: Linux ARM64 (Python 3.12)
            os: ubuntu-24.04-arm
            environment: build-linux-312
            arch: linux-aarch64-cp312
            pyver: '3.12'
            pr_enabled: false

          - name: Linux ARM64 (Python 3.13)
            os: ubuntu-24.04-arm
            environment: build-linux-313
            arch: linux-aarch64-cp313
            pyver: '3.13'
            pr_enabled: false

          - name: Linux ARM64 (Python 3.14)
            os: ubuntu-24.04-arm
            environment: build-linux-314
            arch: linux-aarch64-cp314
            pyver: '3.14'
            pr_enabled: false
            experimental: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        env:
          CONDA_OVERRIDE_CUDA: "12"
        with:
          pixi-version: latest
          environments: ${{ matrix.environment }}
          cache: true

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: tmp/ccache
          key: ccache-${{ matrix.arch }}-${{ matrix.environment }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.arch }}-${{ matrix.environment }}-

      - name: Clone CASA6 source and submodules
        env:
          CASA_BRANCH: ${{ inputs.casa_branch }}
        run: |
          pixi run ${{ matrix.pixi_flags }} -e ${{ matrix.environment }} clone-repo

      - name: Build all components (casacore, casacpp, casatools, casatasks)
        run: |
          pixi run ${{ matrix.pixi_flags }} -e ${{ matrix.environment }} build-all

      - name: Verify installation and Python bindings
        run: |
          pixi run ${{ matrix.pixi_flags }} -e ${{ matrix.environment }} python -c "import casatools; print('✓ casatools version:', casatools.version())"
          pixi run ${{ matrix.pixi_flags }} -e ${{ matrix.environment }} python -c "from casatools import sakura; s = sakura(); print('✓ sakura module:', s)"
          pixi run ${{ matrix.pixi_flags }} -e ${{ matrix.environment }} python -c "import casatasks; print('✓ casatasks imported successfully')"

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: casa6-wheels-${{ matrix.arch }}
          path: |
            src/casa6/casatools/dist/*.whl
            src/casa6/casatasks/dist/*.whl
          if-no-files-found: error

