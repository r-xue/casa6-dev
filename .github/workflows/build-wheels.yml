name: Build CASA6 Wheels (Multi-Arch)

on:
  push:
    branches:
      - main
      - 'fix/*'
      - 'feat/*'
      - 'feature/*'
      - 'release/*'
      - 'ci/*'
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches:
      - main
      - 'ci/*'
      - 'feat/*'
      - 'feature/*'
  workflow_dispatch:
    inputs:
      casa_branch:
        description: 'CASA6 branch/tag to build (empty for default)'
        required: false
        default: ''
        type: string
      python_version:
        description: 'Python version to build (all, 3.12, 3.13, 3.14)'
        required: false
        default: 'all'
        type: choice
        options:
          - 'all'
          - '3.12'
          - '3.13'
          - '3.14'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Dynamically determine the build matrix based on the trigger event
  # ============================================================================
  prepare-matrix:
    name: Configure Build Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Generate matrix JSON
        id: set-matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          PY_VERSION: ${{ inputs.python_version || 'all' }}
        run: |
          python3 - << 'PYEOF'
          import json
          import os

          def target(name, os, env, arch, pyver, pr=False, exp=False, flags=""):
              item = {
                  "name": name,
                  "os": os,
                  "environment": env,
                  "arch": arch,
                  "pyver": pyver,
                  "pr_enabled": pr,
              }
              if exp:
                  item["experimental"] = True
              if flags:
                  item["pixi_flags"] = flags
              return item

          targets = [
              # Linux x86_64
              target(
                  name="Linux x86_64 (Python 3.12)",
                  os="ubuntu-24.04",
                  env="build-linux-312",
                  arch="linux-64-cp312",
                  pyver="3.12",
                  pr=True,
              ),
              target(
                  name="Linux x86_64 (Python 3.13)",
                  os="ubuntu-24.04",
                  env="build-linux-313",
                  arch="linux-64-cp313",
                  pyver="3.13",
              ),
              target(
                  name="Linux x86_64 (Python 3.14)",
                  os="ubuntu-24.04",
                  env="build-linux-314",
                  arch="linux-64-cp314",
                  pyver="3.14",
                  exp=True,
              ),

              # Linux x86_64 with GPU (CUDA) support
              target(
                  name="Linux x86_64 GPU (Python 3.12)",
                  os="ubuntu-24.04",
                  env="build-linux-gpu",
                  arch="linux-64-cuda-cp312",
                  pyver="3.12",
                  pr=True,
                  flags="--platform linux-64-cuda",
              ),

              # macOS Apple Silicon (ARM64)
              target(
                  name="macOS ARM64 (Python 3.12)",
                  os="macos-14",
                  env="build-arm-312",
                  arch="osx-arm64-cp312",
                  pyver="3.12",
                  pr=True,
              ),
              target(
                  name="macOS ARM64 (Python 3.13)",
                  os="macos-14",
                  env="build-arm-313",
                  arch="osx-arm64-cp313",
                  pyver="3.13",
              ),
              target(
                  name="macOS ARM64 (Python 3.14)",
                  os="macos-14",
                  env="build-arm-314",
                  arch="osx-arm64-cp314",
                  pyver="3.14",
                  exp=True,
              ),

              # Linux ARM64
              target(
                  name="Linux ARM64 (Python 3.12)",
                  os="ubuntu-24.04-arm",
                  env="build-linux-312",
                  arch="linux-aarch64-cp312",
                  pyver="3.12",
              ),
              target(
                  name="Linux ARM64 (Python 3.13)",
                  os="ubuntu-24.04-arm",
                  env="build-linux-313",
                  arch="linux-aarch64-cp313",
                  pyver="3.13",
              ),
              target(
                  name="Linux ARM64 (Python 3.14)",
                  os="ubuntu-24.04-arm",
                  env="build-linux-314",
                  arch="linux-aarch64-cp314",
                  pyver="3.14",
                  exp=True,
              ),
          ]

          event_name = os.environ.get("EVENT_NAME", "")
          py_choice = os.environ.get("PY_VERSION", "all")

          if event_name == "pull_request":
              filtered = [t for t in targets if t.get("pr_enabled")]
          elif py_choice != "all":
              filtered = [t for t in targets if t.get("pyver") == py_choice]
          else:
              filtered = targets

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"matrix={json.dumps(filtered)}\n")
          PYEOF

  # ============================================================================
  # Build wheels according to the dynamically resolved matrix
  # ============================================================================
  build-wheels:
    needs: prepare-matrix
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        env:
          CONDA_OVERRIDE_CUDA: "12"
        with:
          pixi-version: latest
          environments: ${{ matrix.environment }}
          cache: true

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: tmp/ccache
          key: ccache-${{ matrix.arch }}-${{ matrix.environment }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.arch }}-${{ matrix.environment }}-

      - name: Clone CASA6 source and submodules
        env:
          CASA_BRANCH: ${{ inputs.casa_branch }}
        run: |
          pixi run ${{ matrix.pixi_flags }} -e ${{ matrix.environment }} clone-repo

      - name: Build all components (casacore, casacpp, casatools, casatasks)
        run: |
          pixi run ${{ matrix.pixi_flags }} -e ${{ matrix.environment }} build-all

      - name: Verify installation and Python bindings
        run: |
          pixi run ${{ matrix.pixi_flags }} -e ${{ matrix.environment }} \
            python -c "import casatools; print('✓ casatools:', casatools.version())"
          pixi run ${{ matrix.pixi_flags }} -e ${{ matrix.environment }} \
            python -c "from casatools import sakura; print('✓ sakura:', sakura())"
          pixi run ${{ matrix.pixi_flags }} -e ${{ matrix.environment }} \
            python -c "import casatasks; print('✓ casatasks imported successfully')"

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: casa6-wheels-${{ matrix.arch }}
          path: |
            src/casa6/casatools/dist/*.whl
            src/casa6/casatasks/dist/*.whl
          if-no-files-found: error
