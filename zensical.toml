# ============================================================================
# Zensical Configuration for CASA6-Dev
# ============================================================================

[project]
site_name = "CASA6-Dev Documentation"
site_description = "Modern build toolchain, multi-arch standalone wheels, and GPU acceleration for CASA 6."
site_author = "@r-xue"
site_url = "https://r-xue.github.io/casa6-dev/"
repo_url = "https://github.com/r-xue/casa6-dev"
repo_name = "r-xue/casa6-dev"
extra_css = ["stylesheets/extra.css"]

copyright = """
Maintained by <a href="https://github.com/r-xue">/rx</a>.
"""

# Navigation Structure
nav = [
    { "Overview" = "index.md" },
    { "Design" = [
        { "Toolchain & Environments" = "design/toolchain.md" },
        { "Patches & Fixes" = "design/patches.md" },
    ]},
    { "Guides" = [
        { "Building Locally" = "guides/building-locally.md" },
        { "GPU & HPG Acceleration" = "guides/gpu-and-hpg.md" },
        { "Standalone Wheels & Index" = "guides/wheels-and-index.md" },
        { "Troubleshooting" = "guides/troubleshooting.md" },
    ]},
    { "Reference" = [
        { "Pixi Tasks & Commands" = "reference/pixi-tasks.md" },
        { "Environment Variables" = "reference/env-vars.md" },
    ]},
    { "Pip Repository (/simple/)" = "https://www.magclouds.org/casa6-dev/simple/" },
]


# ----------------------------------------------------------------------------
# Theme configuration
# ----------------------------------------------------------------------------
[project.theme]
variant = "modern"
language = "en"

features = [
    "announce.dismiss",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    "header.autohide",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.sections",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
]

[project.theme.icon]
logo = "lucide/package"

[project.theme.font]
text = "Inter"
code = "JetBrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
scheme = "default"
primary = "blue grey"
accent = "teal"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "blue grey"
accent = "teal"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "blue grey"
accent = "teal"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

# ----------------------------------------------------------------------------
# Markdown Extensions
# ----------------------------------------------------------------------------
[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.pymdownx.arithmatex]
generic = true
[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.tilde]

[project.extra]
generator = false

